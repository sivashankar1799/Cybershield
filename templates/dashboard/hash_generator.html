{% extends "base.html" %}
{% block content %}
<h1 class="page-title"><i class="fas fa-hashtag"></i> Hash Generator</h1>
<p class="subtitle">MD5 / SHA-1 / SHA-256 / SHA-512 — client-side with server fallback</p>

<div class="row g-3">
  <div class="col-lg-7"><div class="glass p-4">
    <label>Input Text</label>
    <textarea class="form-control mb-2" id="hashInput" rows="3" oninput="doHash()"></textarea>
    <label class="mt-1">Or upload a file</label>
    <input type="file" class="form-control mb-3" id="hashFile" onchange="hashFile()">
    {% for algo in ['md5','sha1','sha256','sha512'] %}
    <div class="mb-2"><label class="text-blue">{{ algo|upper }}</label>
      <div class="code-out" id="out_{{ algo }}" onclick="copyText(this.textContent)">—</div></div>
    {% endfor %}
  </div></div>

  <div class="col-lg-5"><div class="glass p-4">
    <h5 class="text-green">Integrity Verification</h5>
    <label>Hash A</label><input class="form-control mb-2" id="hA">
    <label>Hash B</label><input class="form-control mb-2" id="hB">
    <button class="btn-neon" onclick="compare()"><i class="fas fa-equals"></i> Compare</button>
    <div id="cmpResult" class="mt-3"></div>
  </div></div>
</div>
{% endblock %}
{% block scripts %}
<script>
const enc=new TextEncoder();
async function sub(algo,buf){
  const map={md5:null,sha1:"SHA-1",sha256:"SHA-256",sha512:"SHA-512"};
  // MD5 not in SubtleCrypto → use server fallback for md5.
  if(algo==="md5")return null;
  const h=await crypto.subtle.digest(map[algo],buf);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function doHash(){
  const text=hashInput.value;const buf=enc.encode(text);
  for(const a of ["sha1","sha256","sha512"]){document.getElementById("out_"+a).textContent=await sub(a,buf);}
  // md5 via server
  const r=await apiPost("/api/hash",{text:text});
  if(r.success)document.getElementById("out_md5").textContent=r.hashes.md5;
}
async function hashFile(){
  const f=hashFile.files?hashFile.files[0]:document.getElementById("hashFile").files[0];
  if(!f)return; const buf=await f.arrayBuffer();
  for(const a of ["sha1","sha256","sha512"]){document.getElementById("out_"+a).textContent=await sub(a,buf);}
  document.getElementById("out_md5").textContent="(use text for MD5)";
}
function compare(){
  const a=hA.value.trim().toLowerCase(),b=hB.value.trim().toLowerCase();
  cmpResult.innerHTML = (a&&a===b)
    ? '<div class="alert alert-success">✓ Hashes match — integrity verified.</div>'
    : '<div class="alert alert-danger">✗ Hashes do NOT match.</div>';
}
</script>
{% endblock %}
