{% extends "base.html" %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card glass">
    <div class="brand-big"><i class="fas fa-shield-halved"></i> CyberShield AI</div>
    <h2 class="text-purple">Reset Password</h2>
    <p class="subtitle text-center">Choose a new password for your account.</p>
    <form method="POST" class="reset-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="new_password">New Password</label>
        <input id="new_password" type="password" class="form-control" name="new_password" minlength="8" required autocomplete="new-password">
      </div>
      <div class="mb-3">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" type="password" class="form-control" name="confirm_password" minlength="8" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-neon auth-submit"><i class="fas fa-key"></i> Reset Password</button>
    </form>
    <p class="text-center auth-back"><a href="{{ url_for('login') }}">Back to login</a></p>
  </div>
</div>
{% endblock %}
